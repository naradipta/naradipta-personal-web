# Pintu masuk HTTP di dalam compose (target `web`). TLS TIDAK dihentikan di sini: Nginx/Caddy di host
# yang menanganinya lalu meneruskan semua domain ke port ini (lihat docker/host-nginx.conf.example).
#
# Nama `admin` dan `qa-drill` diselesaikan lewat DNS Docker. Alamatnya ditaruh di variabel supaya Nginx
# tetap bisa start (dan situs statis tetap tersaji) walau salah satu service sedang mati/restart.

resolver 127.0.0.11 valid=10s ipv6=off;

# Skema asli (https) hanya diketahui Nginx host. Redirect relatif ("/projects/") mencegah Location
# berisi http://host/ yang membuat pengunjung HTTPS sempat turun ke HTTP.
absolute_redirect off;

# IP klien asli dikirim Nginx host lewat X-Real-IP. Hanya dipercaya dari jaringan privat (port ini
# hanya dibuka ke 127.0.0.1 di host), dipakai batas laju login admin dan QA Drill.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Real-IP;

# naradipta.com (juga server bawaan untuk Host lain)
server {
    listen 80 default_server;
    server_name naradipta.com www.naradipta.com _;

    root /srv/site;
    index index.html;

    # QA Drill pindah ke subdomain; alamat lama dialihkan.
    location = /learn { return 301 https://learn.naradipta.com/; }
    location /learn/  { return 301 https://learn.naradipta.com/; }

    # Admin: awalan /admin/ dibuang sebelum diteruskan ke server admin.
    location = /admin { return 301 /admin/; }
    location /admin/ {
        set $admin_upstream http://admin:4500;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 12m;      # unggahan foto/PDF
        proxy_read_timeout 120s;       # Publish menjalankan astro build
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# learn.naradipta.com: aplikasi statis (folder learn/ hasil build) + API di /api/
server {
    listen 80;
    server_name learn.naradipta.com;

    root /srv/site/learn;
    index index.html;

    # Berkas statis selalu divalidasi ulang agar pembaruan soal langsung terlihat (ETag tetap menghemat bandwidth).
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /api/ {
        set $qa_upstream http://qa-drill:4400;
        proxy_pass $qa_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1500k;
    }
}
