# Bangun image Docker (web, admin, qa-drill) dan push ke GHCR agar VPS cukup `docker compose pull`.
# VPS hanya punya ±1 GB RAM dan berbagi dengan aplikasi lain, jadi `npm ci` + `astro build` tidak dijalankan di sana.
# Pull request: hanya membangun (tanpa push) untuk memastikan Dockerfile tidak rusak.
name: docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - package.json
      - package-lock.json
      - astro.config.mjs
      - src/**
      - public/**
      - admin/**
      - qa-drill/server/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - package.json
      - package-lock.json
      - astro.config.mjs
      - src/**
      - public/**
      - admin/**
      - qa-drill/server/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [web, admin, qa-drill]
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nama image harus huruf kecil; samakan dengan `image:` di compose.yaml.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
